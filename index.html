<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FanAcierto</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      text-align: center;
    }

    header {
      padding: 35px 20px;
      background: #111c31;
    }

    h1 {
      font-size: 42px;
      margin: 0;
    }

    .logo {
      font-size: 60px;
    }

    .subtitulo {
      color: #cbd5e1;
      margin-top: 10px;
    }

    .contenedor {
      padding: 25px;
    }

    .tarjeta {
      background: #18243a;
      margin: 18px auto;
      padding: 22px;
      border-radius: 18px;
      max-width: 420px;
    }

    button {
      background: #22c55e;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    footer {
      margin-top: 35px;
      padding: 20px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">⚽🏎️</div>
  <h1>FanAcierto</h1>
  <p class="subtitulo">Demostrá cuánto sabés de tus deportes favoritos</p>
</header>

<div class="contenedor">

  <div class="tarjeta">
    <h2>⚽ Fútbol</h2>
    <p>Argentina, Europa y las grandes figuras argentinas.</p>
    <button onclick="alert('¡Muy pronto llegan los desafíos de fútbol!')">
      Jugar
    </button>
  </div>

  <div class="tarjeta">
    <h2>🏎️ Fórmula 1</h2>
    <p>Pronosticá carreras, posiciones y resultados.</p>
    <button onclick="alert('¡Muy pronto llegan los desafíos de F1!')">
      Jugar
    </button>
  </div>

</div>

<footer>
  FanAcierto © 2026
</footer>

</body>
</html>
